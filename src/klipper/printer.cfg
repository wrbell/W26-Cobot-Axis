# W26 Cobot Axis — Klipper Configuration
# Board: BigTreeTech SKR Pico V1.0 (RP2040, TMC2209 x4)
# Purpose: Single-axis stepper control for metal paste pump
#
# Pin reference: docs/skr_pico_specs.md
# Using E-stepper driver socket (most intuitive for pump/extrusion)

# --- MCU ---
[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_PLACEHOLDER-if00
# ^ Find actual path with: ls /dev/serial/by-id/
# After flashing, replace PLACEHOLDER with the actual serial ID.

# --- Printer (required even for non-printer use) ---
[printer]
kinematics: none
max_velocity: 100
max_accel: 500

# --- Pump stepper (E-axis driver on SKR Pico) ---
[manual_stepper pump]
step_pin: gpio14
dir_pin: gpio13
enable_pin: !gpio15
microsteps: 16
rotation_distance: 40
# ^ rotation_distance = distance (mm) per full shaft rotation.
#   For a pump: set so that MOVE units = volume dispensed.
#   Calibrate once pump is received:
#     rotation_distance = (measured_mm_per_rev)
#   With 200-step motor + 16 microsteps = 3200 steps/rev
#   rotation_distance 40 → 0.0125 mm/step
velocity: 50
accel: 200

# --- TMC2209 UART configuration (E-axis) ---
[tmc2209 manual_stepper pump]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 3
run_current: 0.580
# ^ Start conservative. Increase after verifying thermals.
#   SKR Pico limits: 0.8A without fan, ~1.2A with active cooling.
#   RSENSE = 0.110 ohm (on-board, Klipper default).
hold_current: 0.400
stealthchop_threshold: 999999
# ^ StealthChop always on (quiet operation). Set to 0 for SpreadCycle
#   (higher torque at speed). Tune based on pump load.

# --- Respond module (enables RESPOND command for status messages) ---
[respond]

# --- Idle timeout ---
[idle_timeout]
timeout: 3600
# ^ 1 hour before Klipper auto-disables steppers.
#   In production, the bridge daemon should send periodic keepalives.

# --- Virtual SD card (required by some Klipper internals) ---
[virtual_sdcard]
path: ~/gcode_files

# --- Optional: Neopixel status LED ---
# [neopixel status_led]
# pin: gpio24
# chain_count: 1
# color_order: GRB
# initial_RED: 0.0
# initial_GREEN: 0.3
# initial_BLUE: 0.0

# --- Optional: Fan for TMC2209 cooling ---
# Uncomment if running above 0.8A or in warm environment.
# [fan]
# pin: gpio17
# ^ Fan0 port on SKR Pico
