# W26 Cobot Axis -- Mainsail Macros Configuration
# Project: ME472 Mechatronics Capstone (7th Axis Stepper for UR30)
# Deploy to: ~/printer_data/config/mainsail.cfg
# Include from printer.cfg with: [include mainsail.cfg]
#
# This file provides the G-code macros that Mainsail's UI buttons depend on
# (PAUSE, RESUME, CANCEL_PRINT), adapted for our single-axis pump system.
#
# Unlike the stock mainsail-config client.cfg (which targets 3D printers with
# XYZ axes, extruders, and heated beds), these macros are purpose-built for
# a manual_stepper pump with no other axes or thermal components.
#
# Design document: docs/design/klipper_config.md, Section 3

# ===========================================================================
# Mainsail Required Macros
# ===========================================================================
# Mainsail expects PAUSE, RESUME, and CANCEL_PRINT macros. Without these,
# the corresponding UI buttons produce errors. The rename_existing directive
# preserves Klipper's built-in base commands so we can chain to them.

# ---------------------------------------------------------------------------
# PAUSE -- Stops the pump stepper and enters paused state
# ---------------------------------------------------------------------------
# Triggered by the Mainsail Pause button. Stops pump motion and reports
# the position at which the pause occurred.
#
# WARNING: Do not use the Mainsail Pause button while the bridge daemon is
# actively controlling extrusion -- it will conflict with the bridge's state.
# Use only during standalone Mainsail/manual operation.
[gcode_macro PAUSE]
description: Pause the pump
rename_existing: BASE_PAUSE
gcode:
    # Hold the pump at its current position (stops any in-progress move)
    MANUAL_STEPPER STEPPER=pump SET_POSITION={printer["manual_stepper pump"].position}
    RESPOND MSG="Pump paused at position {printer['manual_stepper pump'].position}"
    BASE_PAUSE

# ---------------------------------------------------------------------------
# RESUME -- Resumes pump operation after a pause
# ---------------------------------------------------------------------------
# Triggered by the Mainsail Resume button. Resumes Klipper's paused state.
# Does not automatically restart pump motion -- the bridge daemon or manual
# G-code must command the next move.
[gcode_macro RESUME]
description: Resume the pump
rename_existing: BASE_RESUME
gcode:
    RESPOND MSG="Pump resuming"
    BASE_RESUME

# ---------------------------------------------------------------------------
# CANCEL_PRINT -- Cancels the current operation and disables the stepper
# ---------------------------------------------------------------------------
# Triggered by the Mainsail Cancel button. Disables the pump stepper entirely.
# After cancelling, the stepper must be explicitly re-enabled before it will
# accept motion commands (PUMP_ENABLE or MANUAL_STEPPER ... ENABLE=1).
[gcode_macro CANCEL_PRINT]
description: Cancel pump operation
rename_existing: BASE_CANCEL_PRINT
gcode:
    # Disable the stepper (releases holding torque)
    MANUAL_STEPPER STEPPER=pump ENABLE=0
    RESPOND MSG="Pump operation cancelled"
    BASE_CANCEL_PRINT

# ===========================================================================
# Display Status (required by Mainsail for progress reporting)
# ===========================================================================
# Mainsail reads print progress from the display_status module. Without this,
# the progress bar and percentage display produce errors.
[display_status]

# ===========================================================================
# W26 Pump Control Macros
# ===========================================================================
# Custom macros for monitoring and controlling the pump system. These appear
# as macro buttons in the Mainsail UI.
#
# Recommended Mainsail macro grouping (configure in Mainsail Settings > Macros):
#   Pump Control: PUMP_ENABLE, PUMP_DISABLE, PUMP_ZERO, PUMP_TEST
#   Diagnostics:  PUMP_STATUS, DUMP_TMC (built-in Klipper command)
#   System:       FIRMWARE_RESTART, RESTART (built-in Klipper commands)

# ---------------------------------------------------------------------------
# PUMP_STATUS -- Report pump stepper position and TMC2209 driver state
# ---------------------------------------------------------------------------
# Invoke from the Mainsail console or macro button to check pump state.
# Safe to use while the bridge daemon is running (read-only query).
[gcode_macro PUMP_STATUS]
description: Report pump stepper and TMC2209 status
gcode:
    {% set pump = printer["manual_stepper pump"] %}
    {% set tmc = printer["tmc2209 manual_stepper pump"] %}
    RESPOND MSG="Pump position: {pump.position:.3f} mm"
    RESPOND MSG="TMC run_current: {tmc.run_current}"
    RESPOND MSG="TMC hold_current: {tmc.hold_current}"

# ---------------------------------------------------------------------------
# PUMP_ENABLE -- Enable the pump stepper (applies holding torque)
# ---------------------------------------------------------------------------
[gcode_macro PUMP_ENABLE]
description: Enable the pump stepper
gcode:
    MANUAL_STEPPER STEPPER=pump ENABLE=1
    RESPOND MSG="Pump stepper enabled"

# ---------------------------------------------------------------------------
# PUMP_DISABLE -- Disable the pump stepper (releases holding torque)
# ---------------------------------------------------------------------------
# Use to cut power to the stepper when not in use. The stepper will lose
# its position reference; re-home or re-zero after re-enabling.
[gcode_macro PUMP_DISABLE]
description: Disable the pump stepper
gcode:
    MANUAL_STEPPER STEPPER=pump ENABLE=0
    RESPOND MSG="Pump stepper disabled"

# ---------------------------------------------------------------------------
# PUMP_ZERO -- Set current pump position as zero reference
# ---------------------------------------------------------------------------
# Useful for zeroing after manual positioning or at the start of a session.
# This does not move the stepper; it redefines the current physical position
# as 0.000 mm.
[gcode_macro PUMP_ZERO]
description: Set current pump position as zero
gcode:
    MANUAL_STEPPER STEPPER=pump SET_POSITION=0
    RESPOND MSG="Pump position zeroed"

# ---------------------------------------------------------------------------
# PUMP_TEST -- Test pump with a short extrusion move
# ---------------------------------------------------------------------------
# Parameters:
#   D = distance in mm (default: 10)
#   S = speed in mm/s  (default: 10)
#
# Example from Mainsail console:
#   PUMP_TEST D=20 S=5    (20mm at 5mm/s)
#   PUMP_TEST              (10mm at 10mm/s defaults)
#
# WARNING: Do not run while the bridge daemon is actively controlling
# extrusion. The bridge and this macro would send conflicting MANUAL_STEPPER
# commands simultaneously.
[gcode_macro PUMP_TEST]
description: Test pump with a short extrusion
gcode:
    {% set distance = params.D|default(10)|float %}
    {% set speed = params.S|default(10)|float %}
    MANUAL_STEPPER STEPPER=pump ENABLE=1
    MANUAL_STEPPER STEPPER=pump MOVE={distance} SPEED={speed}
    RESPOND MSG="Pump test: {distance} mm at {speed} mm/s"
