name: CI

on: [push, pull_request, workflow_call]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install ruff pytest pytest-cov ur_rtde

      - name: Lint
        run: ruff check src/bridge/ --output-format=github

      - name: Test with coverage
        run: |
          python -m pytest src/bridge/tests/ -v \
            --cov=src/bridge \
            --cov-fail-under=90 \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml

      - name: Job summary
        if: matrix.python-version == '3.11' && always()
        run: |
          # Extract coverage % and test count from pytest output
          {
            echo "### Test Results (Python ${{ matrix.python-version }})"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            if [ -f coverage.xml ]; then
              cov=$(python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          rate = float(tree.getroot().get('line-rate', 0))
          print(f'{rate*100:.0f}%')
          ")
              echo "| Coverage | ${cov} |"
            fi
            echo "| Python | ${{ matrix.python-version }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test report
        if: matrix.python-version == '3.11' && always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: test-results.xml
          include_passed: false

      - name: Upload coverage artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

      - name: ShellCheck
        if: matrix.python-version == '3.11'
        run: |
          sudo apt-get install -y shellcheck
          shellcheck deploy.sh scripts/dev-sync.sh

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install mypy ur_rtde

      - name: Register mypy problem matcher
        run: echo "::add-matcher::.github/matchers/mypy.json"

      - name: Type check
        run: mypy src/bridge/ --exclude tests/

  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint workflow YAML
        run: yamllint .github/workflows/

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install ur_rtde pytest pytest-cov mypy ruff

      - name: Audit dependencies
        run: |
          pip install pip-audit
          pip-audit

  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install codespell
        run: pip install codespell

      - name: Spell check
        run: codespell --skip="vendor,*.json,.git,.coverage,*.xml" -L "ot"

  deploy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax check
        run: |
          bash -n deploy.sh
          bash -n scripts/dev-sync.sh

      - name: ShellCheck (strict)
        run: |
          sudo apt-get install -y shellcheck
          shellcheck --severity=warning deploy.sh scripts/dev-sync.sh

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check markdown links
        run: |
          python3 << 'PYEOF'
          import os, re, sys

          broken = []
          link_re = re.compile(r'\[([^\]]*)\]\(([^)]+)\)')
          # Matches content inside backticks (inline code spans)
          code_span_re = re.compile(r'`[^`]+`')

          for root, dirs, files in os.walk('.'):
              # Skip hidden dirs and vendor
              dirs[:] = [d for d in dirs if not d.startswith('.') and d != 'vendor']
              for fname in files:
                  if not fname.endswith('.md'):
                      continue
                  fpath = os.path.join(root, fname)
                  with open(fpath, 'r', errors='replace') as f:
                      for lineno, line in enumerate(f, 1):
                          # Strip inline code spans to avoid false positives
                          stripped = code_span_re.sub('', line)
                          for match in link_re.finditer(stripped):
                              target = match.group(2)
                              # Skip URLs, anchors, and mailto
                              if target.startswith(('http://', 'https://', '#', 'mailto:')):
                                  continue
                              # Skip GitHub relative URLs (../../actions/...)
                              if target.startswith('../../'):
                                  continue
                              # Strip anchor from path
                              target = target.split('#')[0]
                              if not target:
                                  continue
                              # Resolve relative to the markdown file's directory
                              resolved = os.path.normpath(os.path.join(os.path.dirname(fpath), target))
                              if not os.path.exists(resolved):
                                  broken.append(f"  {fpath}:{lineno} -> {target}")

          if broken:
              print(f"Found {len(broken)} broken link(s):")
              for b in broken:
                  print(b)
              sys.exit(1)
          else:
              print("All markdown links OK")
          PYEOF
