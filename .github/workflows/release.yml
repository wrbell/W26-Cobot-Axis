name: Release

on:
  push:
    tags: ['v*']

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  firmware:
    uses: ./.github/workflows/firmware.yml

  release:
    needs: [ci, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Stamp version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Stamping version: ${VERSION}"
          sed -i "s/__version__ = \"dev\"/__version__ = \"${VERSION}\"/" src/bridge/_version.py
          cat src/bridge/_version.py

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: klipper-firmware
          path: firmware

      - name: Install pandoc and weasyprint
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          pip install weasyprint

      - name: Generate PDF docs
        run: |
          mkdir -p release-docs
          pandoc README.md -o release-docs/README.pdf \
            --pdf-engine=weasyprint \
            --metadata title="W26 Cobot Axis"
          pandoc docs/design_specification.md -o release-docs/design-specification.pdf \
            --pdf-engine=weasyprint \
            --metadata title="W26 Design Specification"

      - name: Generate changelog
        id: changelog
        run: |
          prev_tag=$(git tag --sort=-creatordate | head -2 | tail -1)
          if [ -z "$prev_tag" ] || [ "$prev_tag" = "${{ github.ref_name }}" ]; then
            body="Initial release — W26 Cobot Axis v${VERSION}"
          else
            log=$(git log "${prev_tag}..HEAD" --pretty=format:"- %s" --no-merges)
            body=$(printf "## Changes since %s\n\n%s" "$prev_tag" "$log")
          fi
          {
            echo 'body<<GHEOF'
            echo "$body"
            echo ""
            echo "**Version:** ${VERSION}"
            echo 'GHEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: |
            firmware/klipper.uf2
            release-docs/README.pdf
            release-docs/design-specification.pdf
