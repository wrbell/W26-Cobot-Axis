name: Release

on:
  push:
    tags: ['v*']

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM cross-compiler
        run: sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Clone Klipper
        run: git clone --depth 1 https://github.com/Klipper3d/klipper.git

      - name: Apply StallGuard overlay
        run: |
          cp src/klipper_mods/stallguard_shared.h klipper/src/rp2040/
          cp src/klipper_mods/core1_stallguard.c klipper/src/rp2040/
          cp src/klipper_mods/stallguard_command.c klipper/src/rp2040/
          sed -i '/rp2040\/i2c\.c/a src-y += rp2040/core1_stallguard.c\nsrc-y += rp2040/stallguard_command.c' klipper/src/rp2040/Makefile
          sed -i '/#include "sched.h"/a /* W26: Core1 StallGuard DIAG pin monitor */\nextern void core1_launch(void);' klipper/src/rp2040/main.c
          sed -i '/sched_main();/i \    core1_launch();' klipper/src/rp2040/main.c

      - name: Write Klipper .config
        run: |
          sed 's/^ *//' > klipper/.config << 'EOF'
          CONFIG_LOW_LEVEL_OPTIONS=y
          CONFIG_MACH_RPXXXX=y
          CONFIG_MACH_RP2040=y
          CONFIG_RPXXXX_FLASH_START_0100=y
          CONFIG_RP2040_FLASH_W25Q080=y
          CONFIG_RPXXXX_USB=y
          EOF

      - name: Build firmware
        run: cd klipper && make olddefconfig && make -j$(nproc)

      - name: Firmware size check
        run: |
          arm-none-eabi-size klipper/out/klipper.elf
          read -r _ data bss _ <<< "$(arm-none-eabi-size klipper/out/klipper.elf | tail -1)"
          sram_used=$((data + bss))
          echo "SRAM usage: $((sram_used / 1024)) KB / 264 KB"
          [ "$sram_used" -le 204800 ] || { echo "FAIL: exceeds 200 KB"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: release-firmware
          path: klipper/out/klipper.uf2

  release:
    needs: [ci, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stamp version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Stamping version: ${VERSION}"
          sed -i "s/__version__ = \"dev\"/__version__ = \"${VERSION}\"/" src/bridge/_version.py
          cat src/bridge/_version.py

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: release-firmware
          path: firmware

      - name: Install pandoc and wkhtmltopdf
        run: sudo apt-get install -y pandoc wkhtmltopdf

      - name: Generate PDF docs
        run: |
          mkdir -p release-docs
          pandoc README.md -o release-docs/README.pdf \
            --pdf-engine=wkhtmltopdf \
            --metadata title="W26 Cobot Axis"
          pandoc docs/design_specification.md -o release-docs/design-specification.pdf \
            --pdf-engine=wkhtmltopdf \
            --metadata title="W26 Design Specification"

      - name: Generate changelog
        id: changelog
        run: |
          prev_tag=$(git tag --sort=-creatordate | head -2 | tail -1)
          if [ -z "$prev_tag" ] || [ "$prev_tag" = "${{ github.ref_name }}" ]; then
            body="Initial release — W26 Cobot Axis v${VERSION}"
          else
            log=$(git log "${prev_tag}..HEAD" --pretty=format:"- %s" --no-merges)
            body=$(printf "## Changes since %s\n\n%s" "$prev_tag" "$log")
          fi
          {
            echo 'body<<GHEOF'
            echo "$body"
            echo ""
            echo "**Version:** ${VERSION}"
            echo 'GHEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: |
            firmware/klipper.uf2
            release-docs/README.pdf
            release-docs/design-specification.pdf
