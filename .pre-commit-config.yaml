repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.7
    hooks:
      - id: ruff
        files: ^src/bridge/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        args: [src/bridge/, --exclude, tests/]
        pass_filenames: false
        additional_dependencies: [ur-rtde]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        files: \.github/workflows/

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: ["--skip=vendor,*.json,.git,.coverage,*.xml", -L, ot]

  # Added by standards/tools/adopt_standards.py.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: check-yaml
      - id: check-added-large-files
        args:
          - --maxkb=10240
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: check-docs
        name: check docs structure
        entry: python3 tools/check_docs.py
        language: system
        pass_filenames: false
        files: '^(README\.md|docs/decisions/.+\.md|templates/README\.template\.md)$'
      - id: agents-md-lint
        name: 'Check AGENTS.md, CLAUDE.md, and Cursor rules'
        entry: python3 tools/agents_md_lint.py
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages:
          - commit-msg
        additional_dependencies:
          - '@commitlint/config-conventional@21.2.3'
        args:
          - --config
          - enforcement/commitlint/commitlint.config.js
